<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e6" />
    <meta name="color-scheme" content="light" />
    <!-- Paint the invitation's cream before the stylesheet arrives (no white flash). -->
    <style>
      html,
      body {
        margin: 0;
        background: #f7f1e6;
      }
    </style>
    <!-- og:start — wedding-api replaces this block with per-invitation link-preview tags. -->
    <meta name="description" content="Undangan pernikahan digital" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Undangan Pernikahan" />
    <meta property="og:title" content="Undangan Pernikahan" />
    <meta property="og:description" content="Undangan pernikahan digital" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="id_ID" />
    <!-- og:end -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights in use; loaded without blocking the first paint (text swaps in). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&amp;family=Jost:wght@300;400&amp;family=Pinyon+Script&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&amp;family=Jost:wght@300;400&amp;family=Pinyon+Script&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&amp;family=Jost:wght@300;400&amp;family=Pinyon+Script&amp;display=swap" /></noscript>
    <title>Undangan Pernikahan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
